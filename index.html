<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PulsePlay</title>
<!-- One join page for everyone: the site root forwards to the app. Old links like /#join-123456 open that room's join page. -->
<script>
  (function () {
    var m = location.hash.match(/join-?(\d{6})/);
    location.replace('app/' + (m ? '#/j/' + m[1] : ''));
  })();
</script>
<noscript><meta http-equiv="refresh" content="0; url=app/"></noscript>
</head>
<body><p><a href="app/">Open PulsePlay</a></p></body>
</html>
