<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Who is in Control?</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* VOICE: warm, witty game-show host who never mocks anyone
   IDEA: a car's rear-view mirror + dashboard: who is behind the wheel?
   PICTURE: mirror with a crown in the reflection, car on a 10-stop road track
   COLOUR and TYPE: warm paper ground, deep violet lead, blue support, green for "in control"; Plus Jakarta Sans
   LAYOUT: projector stage + phone; huge type for questions, one column on phones */
:root{color-scheme:light dark;
--bg:light-dark(#FBF7F1,#14121C);--card:light-dark(#FFFFFF,#1E1B2A);--ink:light-dark(#1E1A2E,#F2EFF9);--muted:light-dark(#655F78,#ABA5BF);
--line:light-dark(#ECE5DA,#312C42);--vi:light-dark(#5A3FD4,#A08CFF);--vi2:light-dark(#EEE9FE,#2B2448);--vi3:light-dark(#3D2A9E,#C9BDFF);
--bl:light-dark(#2563EB,#76A6FF);--bl2:light-dark(#E6EEFE,#1D2A47);--gr:light-dark(#178A5E,#4FD39C);--gr2:light-dark(#E3F6EE,#173328);
--am:light-dark(#B86E0B,#F2B654);--am2:light-dark(#FDF1DE,#3A2C14);--rd:light-dark(#C2410C,#FF9468);--rd2:light-dark(#FDE9E0,#3B2016);
--sh:0 1px 2px rgba(30,20,60,.06),0 8px 28px rgba(30,20,60,.08)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 "Plus Jakarta Sans",system-ui,-apple-system,Segoe UI,sans-serif;overflow-x:clip;min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--bl);outline-offset:2px}
.top{display:flex;align-items:center;gap:12px;padding:12px max(4vw,16px);border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;background:none;border:0;padding:6px 0}
.brand b{color:var(--vi)}
.top .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:5px 11px;border-radius:99px;background:var(--vi2);color:var(--vi3);white-space:nowrap}
.pill.ok{background:var(--gr2);color:var(--gr)}.pill.warn{background:var(--am2);color:var(--am)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.ghost{background:none;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:600;min-height:40px}
.btn{border:0;border-radius:14px;padding:13px 22px;font-weight:700;font-size:16px;min-height:48px;background:var(--vi);color:#fff;box-shadow:0 6px 18px -6px var(--vi);transition:transform .12s}
.btn:hover{transform:translateY(-1px)}.btn:active{transform:translateY(1px)}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.gr{background:var(--gr);box-shadow:0 6px 18px -6px var(--gr)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.wrap{max-width:1240px;margin:0 auto;padding:clamp(20px,4vw,48px) max(4vw,16px)}
h1,h2,h3{line-height:1.08;margin:0;text-wrap:balance;letter-spacing:-.02em}
h1{font-size:clamp(34px,5.4vw,58px);font-weight:800}
h2{font-size:clamp(26px,3.4vw,38px);font-weight:800}
h3{font-size:20px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.tag{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh)}
/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:clamp(24px,4vw,56px);align-items:center}
.hero .tag{font-size:clamp(18px,2vw,22px);margin:14px 0 26px;color:var(--muted)}
.acts{display:grid;gap:12px}
.act{display:flex;align-items:center;gap:16px;text-align:left;padding:18px 20px;border-radius:18px;border:1px solid var(--line);background:var(--card);box-shadow:var(--sh);transition:transform .15s,border-color .15s;width:100%}
.act:hover{transform:translateY(-2px);border-color:var(--vi)}
.act .ic{font-size:30px;width:56px;height:56px;display:grid;place-items:center;border-radius:16px;background:var(--vi2);flex:none}
.act.b .ic{background:var(--bl2)}.act.g .ic{background:var(--gr2)}
.act strong{display:block;font-size:19px}.act span{color:var(--muted);font-size:14.5px}
.act .arr{margin-left:auto;font-size:22px;color:var(--muted)}
.mirror{width:100%;max-width:520px;margin:0 auto;display:block}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:clamp(28px,4vw,52px)}
.how .card{padding:20px}
.how .n{font-size:28px}
.how h3{margin:8px 0 6px}
.note{margin-top:20px;padding:16px 18px;border-radius:16px;background:var(--vi2);color:var(--vi3);font-size:14.5px}

.stage{position:relative;border-radius:24px;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh);overflow:hidden;min-height:520px;display:flex;flex-direction:column}
.stage.fs{border-radius:0;min-height:100vh}
.stg{flex:1;display:flex;flex-direction:column;justify-content:center;padding:clamp(22px,4vw,56px);gap:18px;position:relative}
.stg.c{align-items:center;text-align:center}
.big{font-size:clamp(70px,11vw,140px);line-height:1}
.qtext{font-size:clamp(28px,4.2vw,56px);font-weight:800;line-height:1.12;letter-spacing:-.02em;text-wrap:balance;max-width:22ch}
.fs .qtext{font-size:clamp(36px,5vw,72px)}
.track{position:relative;height:34px;margin:0 clamp(22px,4vw,56px);margin-top:20px}
.track .road{position:absolute;left:0;right:0;top:15px;height:4px;border-radius:4px;background:repeating-linear-gradient(90deg,var(--line) 0 14px,transparent 14px 22px)}
.track .stop{position:absolute;top:11px;width:12px;height:12px;border-radius:50%;background:var(--line);transform:translateX(-50%)}
.track .stop.done{background:var(--vi)}
.track .car{position:absolute;top:-2px;font-size:28px;transform:translateX(-50%) scaleX(-1);transition:left .8s cubic-bezier(.3,1.4,.5,1)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;font-size:14px;font-weight:700;background:var(--vi2);color:var(--vi3)}
.chip.b{background:var(--bl2);color:var(--bl)}.chip.g{background:var(--gr2);color:var(--gr)}.chip.a{background:var(--am2);color:var(--am)}
.cd{font-size:clamp(90px,13vw,170px);font-weight:800;line-height:1;color:var(--vi);font-variant-numeric:tabular-nums}
.cd.pulse{animation:pulse 1s infinite}
@keyframes pulse{0%{transform:scale(1)}15%{transform:scale(1.12)}100%{transform:scale(1)}}
.bar{height:12px;border-radius:12px;background:var(--line);overflow:hidden;width:100%}
.bar i{display:block;height:100%;width:0;background:var(--vi);border-radius:12px;transition:width .3s}
.bar.b i{background:var(--bl)}.bar.g i{background:var(--gr)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.ctrl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:14px clamp(16px,3vw,28px);border-top:1px solid var(--line);background:var(--bg)}
.ctrl .sp{flex:1}
.kbd{font-size:12.5px;color:var(--muted)}
kbd{font:600 12px/1 inherit;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:3px 6px;background:var(--card)}
.joingrid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(20px,4vw,48px);align-items:center}
.qr{width:clamp(180px,24vw,300px);aspect-ratio:1;background:#fff;border-radius:18px;padding:12px;box-shadow:var(--sh);display:grid;place-items:center}
.qr svg{width:100%;height:100%}
.code{font-size:clamp(48px,7vw,92px);font-weight:800;letter-spacing:.06em;color:var(--vi);font-variant-numeric:tabular-nums;line-height:1}
.url{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.count{font-size:clamp(40px,5vw,64px);font-weight:800;line-height:1}
.names{display:flex;flex-wrap:wrap;gap:8px;max-height:150px;overflow:auto}
.names span{padding:6px 12px;border-radius:99px;background:var(--bg);border:1px solid var(--line);font-weight:600;font-size:15px;animation:pop .35s}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.sel{display:grid;gap:6px;font-size:14px;font-weight:600}
.sel select{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);padding:0 10px;font-size:16px}
.trans{font-size:clamp(24px,3.2vw,40px);font-weight:800;text-wrap:balance;animation:pop .4s}
/* gauge */
.gauge{width:min(520px,90%)}
.dist{display:grid;gap:10px;width:min(560px,100%);text-align:left}
.dist .r{display:grid;grid-template-columns:34px minmax(0,1fr) 48px;gap:10px;align-items:center;font-weight:700}
.dist .r .bar{height:16px}
.dist .r em{font-style:normal;text-align:right;color:var(--muted)}
.refl{display:grid;gap:14px;width:min(760px,100%);text-align:left;counter-reset:r}
.refl div{padding:18px 22px;border-radius:18px;background:var(--bg);border:1px solid var(--line);font-size:clamp(19px,2.2vw,26px);font-weight:700;display:flex;gap:14px;align-items:center}
.refl div::before{counter-increment:r;content:counter(r);flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--vi);color:#fff;font-size:17px}
.final{font-size:clamp(22px,2.8vw,34px);font-weight:800;color:var(--vi);text-wrap:balance}
/* demo */
.demo{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;align-items:start}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-radius:14px;background:var(--am2);color:var(--am);font-weight:700;font-size:14.5px;margin-bottom:16px}
.phone{border-radius:40px;border:10px solid var(--ink);background:var(--bg);min-height:680px;overflow:hidden;position:relative;box-shadow:var(--sh)}

.phone .ph{padding:44px 18px 22px}
.bots{margin-top:14px;padding:16px}
.bots .row{margin-top:10px}
/* participant */
.pv{max-width:480px;margin:0 auto;display:grid;gap:16px}
.pv.solo{padding:20px 16px 40px}
.pcard{padding:20px}
.pq{font-size:22px;font-weight:800;line-height:1.2;text-wrap:balance}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;min-height:58px;padding:12px 14px;border-radius:16px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:16.5px;transition:transform .1s,border-color .1s}
.opt .l{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;font-size:15px}
.opt:nth-child(1) .l{background:var(--vi)}.opt:nth-child(2) .l{background:var(--bl)}.opt:nth-child(3) .l{background:var(--gr)}.opt:nth-child(4) .l{background:var(--am)}
.opt:not([disabled]):hover{border-color:var(--vi);transform:translateY(-1px)}
.opt[disabled]{cursor:default;opacity:.55}
.opt.picked{opacity:1;border-color:var(--vi);background:var(--vi2)}
.pcd{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:800}
.pcd .n{font-size:40px;color:var(--vi);font-variant-numeric:tabular-nums;line-height:1}
.field{display:grid;gap:6px;font-weight:700;font-size:14px}
.field input[type=text]{min-height:50px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);padding:0 14px;font-size:18px}
.field input.codein{font-size:26px;letter-spacing:.2em;font-weight:800;text-align:center}
.priv{font-size:14px;display:grid;gap:8px;padding:16px;border-radius:16px;background:var(--vi2);color:var(--vi3)}
.priv ul{margin:0;padding-left:18px;display:grid;gap:4px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:15px;font-weight:600}
.check input{width:22px;height:22px;margin-top:1px;accent-color:var(--vi);flex:none}
.err{color:var(--rd);font-weight:700;font-size:14px}
.wait{text-align:center;display:grid;gap:12px;padding:28px 18px}
.drive{font-size:56px;animation:drive 2.4s ease-in-out infinite}
@keyframes drive{0%,100%{transform:translateX(-40px) scaleX(-1)}50%{transform:translateX(40px) scaleX(-1)}}
.res{text-align:center;display:grid;gap:12px;padding:22px 18px;position:relative;overflow:hidden}
.res .em{font-size:84px;line-height:1;animation:rise .7s cubic-bezier(.3,1.5,.5,1)}
@keyframes rise{from{transform:translateY(30px) scale(.4);opacity:0}}
.res .sc{font-size:46px;font-weight:800;color:var(--vi);line-height:1}
.res .sc small{font-size:18px;color:var(--muted)}
.res .q{font-style:italic;color:var(--muted)}
.res ul{text-align:left;margin:0;padding:0;list-style:none;display:grid;gap:8px}
.res li{padding:10px 12px;border-radius:12px;background:var(--bg);font-size:15px}
.res li b{display:block;font-size:12.5px;color:var(--muted);font-weight:700}
.cover{display:grid;place-items:center;gap:14px;padding:40px 20px;text-align:center;cursor:pointer;border:0;background:none;width:100%}
.cover .m{font-size:90px;animation:wob 2s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.conf{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.conf i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall 2.6s ease-in forwards}
@keyframes fall{to{transform:translateY(720px) rotate(560deg);opacity:.2}}
.modal{position:fixed;inset:0;background:rgba(15,10,30,.5);display:grid;place-items:center;padding:16px;z-index:50}
.modal .card{max-width:520px;padding:24px;display:grid;gap:14px}
.small{font-size:13px}
.rm *,.rm *::before{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
@media(max-width:980px){.demo{grid-template-columns:minmax(0,1fr)}.phone{max-width:400px;margin:0 auto;width:100%}}
@media(max-width:760px){.hero{grid-template-columns:minmax(0,1fr)}.hero .pic{order:-1}.mirror{max-width:340px}.how{grid-template-columns:minmax(0,1fr)}.joingrid{grid-template-columns:minmax(0,1fr);justify-items:center;text-align:center}.stage{min-height:440px}.top .hide-s{display:none}}
</style>
</head>

function joinURL(code) { if (NET) return location.origin + location.pathname + '#join-' + code; return (ARTIFACT_URL.startsWith('http') ? ARTIFACT_URL : 'https://claude.ai/artifact/…') + '#join-' + code; }
function qrSVG(text) { try { const q = qrcode(0, 'M'); q.addData(text); q.make(); return q.createSvgTag({ cellSize: 4, margin: 0, scalable: true }); } catch (e) { return '<p class="small muted">QR unavailable — use the code.</p>'; } }

function gauge(v) {

  return `<svg class="gauge" viewBox="0 0 400 240" role="img" aria-label="Gauge at ${v} out of 100">${seg(0, 25, 'var(--gr)')}${seg(25.5, 50, 'var(--bl)')}${seg(50.5, 75, 'var(--am)')}${seg(75.5, 100, 'var(--rd)')}
  <line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--ink)" stroke-width="8" stroke-linecap="round" style="transform-origin:200px 200px;animation:needle 1.6s cubic-bezier(.3,1.4,.5,1)"/>
  <circle cx="${cx}" cy="${cy}" r="14" fill="var(--ink)"/><text x="40" y="232" font-size="15" fill="var(--muted)" text-anchor="middle">0</text><text x="360" y="232" font-size="15" fill="var(--muted)" text-anchor="middle">100</text></svg>

}

function paintBots() {
  const b = app.demoHub, root = $('#botRoot'); if (!b || !root) return; const st = app.host.s.stage;
  root.innerHTML = `<div class="row" style="justify-content:space-between"><h3>🤖 Simulated colleagues: ${b.bots.length}</h3><label class="check" style="font-size:14px"><input type="checkbox" data-act="autoBots" ${b.auto ? 'checked' : ''}> Bots answer automatically</label></div>
  <div class="row"><button class="ghost" data-act="bot1" ${b.bots.length >= 18 || !['welcome', 'join', 'ready'].includes(st) ? 'disabled' : ''}>+1 colleague</button><button class="ghost" data-act="bot5" ${b.bots.length >= 18 || !['welcome', 'join', 'ready'].includes(st) ? 'disabled' : ''}>+5 colleagues</button>
  <span class="small muted">Add 4+ bots (plus you) to unlock the team score. Bots join only before the game starts.</span></div>`;
}

/* ---------- TICKER ---------- */
function tick() {
  const now = performance.now(), wall = Date.now();
  document.querySelectorAll('[data-left]').forEach(e => { const l = Math.max(0, Math.ceil((+e.dataset.left - now) / 1000)); e.textContent = e.dataset.alarm && l === 0 ? '⏰' : l; });
  document.querySelectorAll('[data-leftabs]').forEach(e => { const l = Math.max(0, Math.ceil((+e.dataset.leftabs - wall) / 1000)); e.textContent = e.dataset.alarm && l === 0 ? '⏰' : l; });
  document.querySelectorAll('[data-count]').forEach(e => { const l = 3 - Math.floor((now - +e.dataset.count) / 1000); e.textContent = l > 0 ? l : '🚦'; });
  document.querySelectorAll('[data-fill]').forEach(e => { const [st, d] = e.dataset.fill.split('|').map(Number); e.style.width = Math.min(100, 100 * (now - st) / d) + '%'; });
  const p = app.player; if (p && p.joined && p.st?.stage === 'q' && p.st.phase === 'answer') { const open = p.canPick(); if (open !== p._open) { p._open = open; paintPhone(); } }
}
setInterval(tick, 200);

/* ---------- ACTIONS ---------- */
async function startDemo() {
  app.demoHub?.reset(); app.host?.destroy();
  const hub = new DemoHub(), code = String(100000 + Math.floor(Math.random() * 900000));
  app.demoHub = hub; app.view = 'demo'; $('#app').innerHTML = '';
  app.host = new Host(hub, code, { read: 5, ans: 5, demo: true }); await app.host.open();
  app.player = new Player(hub, code, true); hub.addBots(6); paint();
}
async function createRoom() {
  let code, hub;
  if (NET) { hub = new RpcHub(); try { code = await hub.create(app.hostSetup.read, app.hostSetup.ans); } catch (e) { toast('Could not create the room: ' + e.message); return paint(); } }
  else for (let i = 0; i < 6; i++) { code = String(100000 + Math.floor(Math.random() * 900000)); hub = new LiveHub(code); if (!(await hub.exists())) break; }
  app.liveHub = hub; app.host = new Host(hub, code, { read: app.hostSetup.read, ans: app.hostSetup.ans }); $('#app').innerHTML = '';
  try { await app.host.open(); } catch (e) { app.host = null; toast('Could not create the room. You may need Contributor or Editor access to this page.'); return paint(); }
  paint();
}
async function resumeHost() {
  let rec = null; try { rec = JSON.parse(localStorage.getItem('ec_host') || 'null'); } catch (e) {}
  if (!rec) return; const hub = new RpcHub(rec.code); hub.hostToken = rec.hostToken;
  let j; try { j = await hub.hostState(); } catch (e) { try { localStorage.removeItem('ec_host'); } catch (e2) {} toast('That room has ended.'); app.savedHost = null; return paint(); }
  hub.last = j.room; app.liveHub = hub; const r = j.room;
  const h = new Host(hub, rec.code, { read: r.readMs / 1000, ans: r.ansMs / 1000 }); Object.assign(h.s, { stage: r.stage, q: r.q, phase: r.phase, seq: r.seq });
  if (r.stage === 'q' && r.phase === 'answer') h.s.phase = 'answer';
  app.host = h; $('#app').innerHTML = ''; await h.open(); h.schedule(); paint();
}
async function doJoin() {
  const p = app.player, nick = ($('#nickIn')?.value || '').trim(), ok = $('#okIn')?.checked;
  const err = m => { if (p) p.err = m; else app.joinErr = m; paintPhone(); };
  if (!nick) return err('Please enter a first name or nickname.'); if (!ok) return err('Please tick the box to confirm you want to play.');
  if (p?.demo) { p.err = ''; await p.join(nick); return paint(); }
  const code = ($('#codeIn')?.value || '').replace(/\D/g, '');
  if (code.length !== 6) return err('Room codes have 6 digits.');
  if (!DB && !NET) return err('Live games are not available in this view. Try Demo Mode.');
  const hub = NET ? new RpcHub(code) : new LiveHub(code); let st; try { st = await hub.exists(); } catch (e) { return err('Could not reach the room. Check your connection.'); }
  if (!st) return err('No active room with that code.');
  app.joinErr = ''; const pl = new Player(hub, code, false); app.player = pl;
  try { await pl.join(nick); } catch (e) { app.player = null; return err(NET ? 'Could not join: ' + e.message : 'Could not join. You may need access to this page (ask the host).'); }
  paint();
}
async function resume() {
  let rec = null; try { rec = JSON.parse(localStorage.getItem('ec_session') || 'null'); } catch (e) {}
  if (DB && UID) { try { const s = await DB.collection('data/users/' + UID).orderBy('exp', 'desc').limit(1).get(); if (s.docs[0]) rec = s.docs[0].data(); } catch (e) {} }
  if (!rec || rec.exp < Date.now()) return false;
  const hub = NET ? new RpcHub(rec.code) : new LiveHub(rec.code); let st; try { st = await hub.exists(); } catch (e) { return false; } if (!st) return false;
  const pl = new Player(hub, rec.code, false); app.player = pl; app.view = 'join'; $('#app').innerHTML = '';
  pl.nick = rec.nick; try { await pl.join(rec.nick, rec); } catch (e) { app.player = null; try { localStorage.removeItem('ec_session'); } catch (e2) {} return false; } paint(); return true;
}
function resultText(p) {
  const ev = evaluate(p.answers, p.seed); if (!ev.valid) return `Who is in Control? 🪞 — I answered ${ev.answered}/10, not enough for a score this time.`;
  const c = CATS[ev.cat]; return `Who is in Control? 🪞\n${c.e} ${c.t} — ${ev.score}/100 Ego Driving Score\n${ev.obs.map(o => '• ' + o.t).join('\n')}\nHabit: ${ev.habit}\nTomorrow: ${ev.challenge}`;
}
async function fullscreen() { const el = $('#stageEl'); try { if (document.fullscreenElement) await document.exitFullscreen(); else { await (el?.requestFullscreen?.()); app.fs = true; paintStage(); } } catch (e) { app.fs = !app.fs; paintStage(); } }
document.addEventListener('fullscreenchange', () => { app.fs = !!document.fullscreenElement; paintStage(); });

document.addEventListener('click', async e => {
  const t = e.target.closest('[data-act]'); if (!t) return; const a = t.dataset.act;
  if (a === 'home') { app.host?.destroy(); app.liveHub?.stop?.(); app.demoHub?.reset(); Object.assign(app, { view: 'home', host: null, player: null }); $('#app').innerHTML = ''; paint(); }
  if (a === 'goDemo') startDemo();
  if (a === 'goHost') { try { const h = JSON.parse(localStorage.getItem('ec_host') || 'null'); app.savedHost = h && h.exp > Date.now() ? h.code : null; } catch (e) {} app.view = 'host'; app.host = null; $('#app').innerHTML = ''; paint(); }
  if (a === 'goJoin') { app.view = 'join'; app.player = null; $('#app').innerHTML = ''; paint(); }
  if (a === 'createRoom') { t.disabled = true; createRoom(); }
  if (a === 'resumeHost') { t.disabled = true; resumeHost(); }
  if (a === 'next') app.host?.next();
  if (a === 'fs') fullscreen();
  if (a === 'toggleNames') { app.host.showNames = !app.host.showNames; paint(); }
  if (a === 'newGame') { if (app.view === 'demo') return startDemo(); const old = app.liveHub; app.host.destroy(); old?.stop(); old?.purge().catch(() => {}); app.host = null; $('#app').innerHTML = ''; paint(); }
  if (a === 'endRoom') { $('#modal').innerHTML = `<div class="modal"><div class="card"><h3>End the game and delete room data?</h3><p class="muted">Lobby names, progress flags and anonymous scores for room ${app.host.code} will be deleted. Players keep their personal result on their own device.</p><div class="row"><button class="btn" data-act="endYes">End &amp; delete</button><button class="btn sec" data-act="closeModal">Cancel</button></div></div></div>`; }
  if (a === 'endYes') { $('#modal').innerHTML = ''; const h = app.host; h.set({ stage: 'ended' }); await sleep(800); try { await app.liveHub.purge(); } catch (e) {} app.liveHub.stop(); h.destroy(); app.host = null; $('#app').innerHTML = ''; toast('Room ended and its data deleted.'); paint(); }
  if (a === 'closeModal') $('#modal').innerHTML = '';
  if (a === 'join') { t.disabled = true; await doJoin(); }
  if (a === 'pick') app.player?.pick(+t.dataset.o);
  if (a === 'reveal') { app.player.revealed = true; app.player.save(); paintPhone(); }
  if (a === 'copyRes') { const m = $('#copyMsg'); try { await navigator.clipboard.writeText(resultText(app.player)); m.textContent = 'Copied — paste it wherever you like. Nothing was shared automatically.'; } catch (er) { m.textContent = 'Copy blocked by the browser — take a screenshot instead.'; } }
  if (a === 'forget') { await app.player.forget(); app.player = null; app.view = 'home'; $('#app').innerHTML = ''; toast('Your saved answers and result were deleted from this device and your private storage.'); paint(); }
  if (a === 'bot1') { app.demoHub.addBots(1); paintBots(); }
  if (a === 'bot5') { app.demoHub.addBots(5); setTimeout(paintBots, 1500); paintBots(); }
  if (a === 'autoBots') { app.demoHub.auto = t.checked; }
  if (a === 'motion') { app.motion = !app.motion; document.documentElement.classList.toggle('rm', !app.motion); t.textContent = 'Motion: ' + (app.motion ? 'on' : 'off'); t.setAttribute('aria-pressed', String(!app.motion)); }
});
document.addEventListener('change', e => {
  const k = e.target.dataset.set; if (!k) return; const v = +e.target.value;
  if (app.host) app.host.setTimer(k === 'read' ? 'readMs' : 'ansMs', v); else app.hostSetup[k] = v;
});
document.addEventListener('keydown', e => {
  if (!app.host || ['INPUT', 'SELECT', 'TEXTAREA', 'BUTTON'].includes(document.activeElement?.tagName) && (e.key === ' ' || e.key === 'Enter' || document.activeElement.tagName !== 'BUTTON')) return;
  if (app.view === 'demo' && document.activeElement?.closest?.('.phone')) return;
  if (e.key === ' ' || e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); app.host.next(); }
  if (e.key === 'f' || e.key === 'F') fullscreen();
});
document.addEventListener('input', e => { if (e.target.id === 'codeIn') e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6); });

/* ---------- BOOT ---------- */
function setLive(st) {
  liveState = st; const el = $('#live');
  el.className = 'pill hide-s ' + (st === 'ok' ? 'ok' : st === 'off' ? 'warn' : '');
  el.innerHTML = `<span class="dot"></span>${st === 'ok' ? 'Live mode ready' : st === 'off' ? 'Live mode offline · Demo ready' : 'Checking live mode…'}`;
  if (['home', 'host'].includes(app.view) && !app.host) paint();
}
const m = (location.hash || '').match(/^#join-(\d{6})$/); if (m) { app.view = 'join'; app.joinCode = m[1]; }
paint();
if (NET) (async () => {
  try { await new RpcHub('000000').rpc('room_state', { p_code: '000000' }); setLive('ok'); } catch (e) { setLive('off'); }
  if (liveState === 'ok' && ['home', 'join'].includes(app.view)) { const r = await resume(); if (!r && app.view === 'join') paint(); }
})();
else (async () => {
  const timeout = new Promise(r => setTimeout(() => r(null), 10000));
  try {
    const c = window.claude; if (!c || !c.use) throw 0;
    DB = await Promise.race([c.use('db'), timeout]); USER = await Promise.race([c.use('user'), timeout]);
    if (USER) { try { UID = await USER.id(); } catch (e) {} }
    setLive(DB ? 'ok' : 'off');
    if (DB) { purgeExpired(); if (['home', 'join'].includes(app.view) && !app.host && (!app.player || !app.player.joined)) { const r = await resume(); if (!r && app.view === 'join') paint(); } }
  } catch (e) { setLive('off'); }
})();
}
</script>
</body>
</html>
